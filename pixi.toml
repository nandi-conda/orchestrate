[workspace]
name = "orchestrate"
version = "0.1.0"
description = "Project-based agent orchestrator: control plane + ultra UI, the agent runner, and a PySide6 desktop client"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

# A front door, not a package: the subprojects own their dependencies
# (orchestrator/pixi.toml, runner/pixi.toml, desktop/pixi.toml) and deploy separately. Every task
# here delegates, so each dependency list stays in one place. A delegated task
# runs with the subproject as its working directory, exactly like `cd` + `pixi run`.
[tasks]
setup = { cmd = "pixi install --manifest-path runner && pixi install --all --manifest-path orchestrator && pixi install --all --manifest-path desktop", description = "Install every subproject's environments, including the test envs" }
serve = { cmd = "pixi run --manifest-path orchestrator serve", description = "Build the UI, then serve the control plane on http://127.0.0.1:8000" }
desktop = { cmd = "pixi run --manifest-path desktop start", description = "Open the PySide6 desktop client on the control plane at http://127.0.0.1:8000" }
worker = { cmd = "pixi run --manifest-path runner serve", description = "Run a runner service on :8080 (a worker; the control plane starts one per project itself)" }
test = { cmd = "pixi run --manifest-path runner test && pixi run --manifest-path orchestrator test && pixi run --manifest-path desktop test", description = "Run every test suite: runner, orchestrator, desktop" }
set-key = { cmd = "pixi run --manifest-path runner set-key", description = "Store a secret in the system keyring, e.g. pixi run set-key DEEPSEEK_API_KEY" }
