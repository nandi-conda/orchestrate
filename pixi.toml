[workspace]
name = "orchestrate"
version = "0.1.0"
description = "Project-based agent orchestrator: control plane + ultra UI (in a browser or a desktop window), and the agent runner"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

# A front door, not a package: the subprojects own their dependencies
# (orchestrator/pixi.toml, runner/pixi.toml) and deploy separately. Every task
# here delegates, so each dependency list stays in one place. A delegated task
# runs with the subproject as its working directory, exactly like `cd` + `pixi run`.
[tasks]
setup = { cmd = "pixi install --manifest-path runner && pixi install --all --manifest-path orchestrator", description = "Install both subprojects' environments, including the orchestrator's test and desktop envs" }
serve = { cmd = "pixi run --manifest-path orchestrator serve", description = "Build the UI, then serve the control plane on http://127.0.0.1:8000" }
desktop = { cmd = "pixi run --manifest-path orchestrator desktop", description = "Open the UI in a desktop window, with the control plane running in the same process (--port, --db)" }
desktop-fix = { cmd = 'claude --permission-mode acceptEdits "Read .agents/desktop-fix.md and do what it says."', description = "Start Claude Code (claude on your PATH) to run the desktop window, watch its output and land fixes for every error it prints" }
worker = { cmd = "pixi run --manifest-path runner serve", description = "Run a runner service on :8080 (a worker; the control plane starts one per project itself)" }
test = { cmd = "pixi run --manifest-path runner test && pixi run --manifest-path orchestrator test && pixi run --manifest-path orchestrator test-desktop", description = "Run every test suite: runner, orchestrator, the desktop window" }
package = { cmd = "pixi exec rattler-build build --recipe recipe/recipe.yaml -c conda-forge -c https://prefix.dev/nandi-testing --output-dir output", env = { ORCHESTRATE_VERSION = "0.1.0" }, description = "Build the orchestrate conda package into output/ (CI publishes it on every push to main)" }
deploy-sync = { cmd = "pixi run --manifest-path sync deploy", description = "Deploy the sync server to your Cloudflare account with wrangler (signs in if needed); safe to run again" }
set-key = { cmd = "pixi run --manifest-path runner set-key", description = "Store a secret in the system keyring, e.g. pixi run set-key DEEPSEEK_API_KEY" }

# The documentation site (mkdocs.yml, docs/). It documents both subprojects, so
# it lives here rather than in either of them.
[feature.docs.dependencies]
python = "3.12.*"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
pymdown-extensions = ">=10"

[feature.docs.tasks]
docs = { cmd = "mkdocs serve --dev-addr 127.0.0.1:8001", description = "Serve the documentation site with live reload on http://127.0.0.1:8001" }
docs-build = { cmd = "mkdocs build --strict", description = "Build the documentation site into site/ (strict: a broken link fails the build)" }

[environments]
docs = { features = ["docs"], no-default-feature = true }
