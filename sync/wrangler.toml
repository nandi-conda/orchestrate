# The sync server: one Worker, one Durable Object holding every synced
# document, lease and hub manifest, and an R2 bucket for git bundles and
# images (README.md). Deploy with `npx wrangler deploy` once the bucket and the
# SYNC_TOKEN secret exist (docs/guide/sync.md).
name = "orchestrate-sync"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncHub"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "orchestrate-sync"
