# Read by rattler-build next to recipe.yaml. orchestrate pins python 3.12, so
# that is the one Python built. The compilers and C runtimes follow conda-forge's
# pinnings, so the extension loads in a conda-forge environment.
python:
  - "3.12"
c_compiler:
  - if: linux
    then: gcc
  - if: osx
    then: clang
  - if: win
    then: vs2022
c_compiler_version:
  - if: linux
    then: "14"
  - if: osx
    then: "19"
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs
c_stdlib_version:
  - if: linux
    then: "2.17"
  - if: osx and x86_64
    then: "10.13"
  - if: osx and arm64
    then: "11.0"
  - if: win
    then: "2022"
