[workspace]
name = "orchestrator"
version = "0.1.0"
description = "Control plane and ultra UI for the project-based agent orchestrator"
# linux-aarch64 is left out: ultra needs lpython 0.22, which conda-forge does not build for it.
channels = ["conda-forge", "https://prefix.dev/nandi-testing"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"
starlette = ">=0.46"
uvicorn = ">=0.34"
httpx = ">=0.28"
aiosqlite = ">=0.21"
asyncpg = ">=0.30"
keyring = ">=25"
ultra = ">=0.1.20,<0.2"

[feature.test.dependencies]
pytest = ">=8"
pytest-xdist = ">=3"
anyio = ">=4"
nodejs = ">=22"
postgresql = ">=18.4,<19"

# The desktop window (desktop/): Qt draws the window, the ultra UI fills it, and
# the control plane runs in the same process. conda-forge has no qt6-webengine
# for osx-64.
[feature.desktop]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.desktop.dependencies]
pyside6 = ">=6.8"
qt6-webengine = ">=6.8"

[feature.desktop.tasks]
desktop = { cmd = "python -m desktop", depends-on = ["build-ui"], default-environment = "desktop", description = "Open the UI in a desktop window, with the control plane in the same process (--port, --db)" }

[feature.desktop-test]
platforms = ["linux-64", "osx-arm64", "win-64"]

[feature.desktop-test.dependencies]
pytest = ">=8"
pytest-qt = ">=4.4"

[feature.desktop-test.tasks]
test-desktop = { cmd = "pytest -q tests_desktop", depends-on = ["build-ui"], env = { QT_QPA_PLATFORM = "offscreen" } }

[environments]
test = ["test"]
desktop = ["desktop"]
desktop-test = ["desktop", "desktop-test"]

[tasks]
build-ui = { cmd = "python -c \"import os;os.makedirs('ui/dist',exist_ok=True)\" && ultra build ui/app.py -o ui/dist/app.wasm && python -c \"import shutil;[shutil.copy('ui/'+f,'ui/dist/'+f) for f in ('index.html','imports.js','markdown.js','app.css','icon.svg')]\"" }
serve = { cmd = "python -m control", depends-on = ["build-ui"] }
set-key = { cmd = "keyring set orchestrate", description = "Store a secret in the system keyring, e.g. pixi run set-key DEEPSEEK_API_KEY" }

[feature.test.tasks]
# Each test has its own directory, ports and workers, so they run side by side.
test = { cmd = "pytest -q tests -n auto", depends-on = ["build-ui"] }
