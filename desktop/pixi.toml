[workspace]
name = "orchestrate-desktop"
version = "0.1.0"
description = "Desktop window for the orchestrator: PySide draws it, the control plane's ultra UI fills it"
channels = ["conda-forge"]
# osx-64 is left out: conda-forge has no qt6-webengine for it. linux-aarch64 too: the control plane
# the window starts needs ultra, which has no build there.
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
pyside6 = ">=6.8"
qt6-webengine = ">=6.8"

# The tests run the real control plane (../orchestrator) on its echo runner
# (tests/serve_echo.py), so they need its dependencies; its UI is built by
# ../orchestrator's own build-ui task.
[feature.test.dependencies]
pytest = ">=8"
pytest-qt = ">=4.4"
starlette = ">=0.46"
uvicorn = ">=0.34"
httpx = ">=0.28"
aiosqlite = ">=0.21"
keyring = ">=25"

[environments]
test = ["test"]

[tasks]
start = { cmd = "python -m orchestrate_desktop", description = "Open the UI in a desktop window; it starts and owns the control plane on :8000 (--port N), or --url shows one" }

[feature.test.tasks]
test = { cmd = "pixi run --manifest-path ../orchestrator/pixi.toml build-ui && pytest -q tests", env = { QT_QPA_PLATFORM = "offscreen" } }
