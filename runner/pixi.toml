[workspace]
name = "orchestrate-runner"
version = "0.1.0"
description = "Agent runner: hosts many agent threads, pluggable model and sandbox"
channels = ["conda-forge"]
# Linux only: threads' commands run in bubblewrap (see src/runner/sandbox.py).
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.12.*"
git = "*"
httpx = ">=0.27"
starlette = ">=0.38"
uvicorn = ">=0.30"
keyring = ">=25"
bubblewrap = "*"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[feature.test.dependencies]
pytest = "*"
pytest-asyncio = "*"

[environments]
default = { features = ["test"], solve-group = "default" }
prod = { features = [], solve-group = "default" }

[tasks]
serve = "python -m runner.server"
run = "python -m runner.cli"
test = "pytest -q"
set-key = { cmd = "keyring set orchestrate", description = "Store a secret in the system keyring, e.g. pixi run set-key DEEPSEEK_API_KEY" }
